services:
  n8n-runner:
    container_name: dialogato-n8n-runner
    restart: unless-stopped
    env_file:
      - ../../.env
    networks:
      - dialogato-n8n-net
    image: n8nio/runners:${N8N_VERSION}
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      - n8n
