services:
  redis:
    container_name: ashesborn-redis
    env_file:
      - ../../.env
    image: redis:${REDIS_VERSION}
    networks:
      - ashesborn-n8n-net
    command: >
      redis-server --port 6379 --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - evolution_redis:/data
