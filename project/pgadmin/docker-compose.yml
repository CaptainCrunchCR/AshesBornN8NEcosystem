services:
  pgadmin:
    container_name: ashesborn-pgadmin
    restart: unless-stopped
    env_file:
      - ../../.env
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    networks:
      - ashesborn-n8n-net
    # Only reachable from the server itself; open it through an SSH tunnel.
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
