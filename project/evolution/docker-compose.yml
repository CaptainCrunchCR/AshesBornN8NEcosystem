services:
  evolution:
    container_name: ashesborn-evolution
    restart: unless-stopped
    env_file:
      - ../../.env
    networks:
      - ashesborn-n8n-net
    image: evoapicloud/evolution-api:${EVOLUTION_VERSION}
    environment:
      - SERVER_URL=https://${EVOLUTION_HOSTNAME}
      - AUTHENTICATION_API_KEY=${EVOLUTION_AUTHENTICATION_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_NON_ROOT_USER}:${POSTGRES_NON_ROOT_PASSWORD}@postgres:5432/${POSTGRES_EVOLUTION_DB}?schema=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/6
      - CACHE_LOCAL_ENABLED=false
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
