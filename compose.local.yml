# Local development on your own computer: no Cloudflare Tunnel, plain HTTP on localhost.
#   docker compose -f docker-compose.yml -f compose.local.yml up -d postgres redis n8n n8n-runner evolution
# n8n: http://localhost:5678   Evolution: http://localhost:8080
services:
  n8n:
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_PROXY_HOPS=0
  evolution:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
